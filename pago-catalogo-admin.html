<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pago · Catálogo Digital</title>
<style>
:root{--bg:#0b1020;--card:#151b33;--card2:#1c2445;--tx:#eef1ff;--mut:#9aa4cf;--ac:#6c5ce7;--ac2:#00d2a0;--gold:#f7b731;--bd:#2a3563;--red:#ff6b6b}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:radial-gradient(circle at 20% 0,#2a1f6b 0,var(--bg) 45%);color:var(--tx);min-height:100vh;padding:20px 14px 40px}
.w{max-width:560px;margin:auto}
.hd{text-align:center;margin-bottom:20px}
.badge{display:inline-block;background:rgba(0,210,160,.15);color:var(--ac2);padding:5px 12px;border-radius:20px;font-size:12px;font-weight:600;margin-bottom:10px}
h1{font-size:26px}.sub{color:var(--mut);font-size:14px;margin-top:6px}
.price{background:linear-gradient(135deg,var(--ac),#a29bfe);border-radius:20px;padding:22px;text-align:center;box-shadow:0 10px 30px rgba(108,92,231,.4);margin-bottom:14px}
.price small{opacity:.85;font-size:13px}
.usd{font-size:46px;font-weight:800;line-height:1.1}
.bs{font-size:22px;font-weight:700;margin-top:4px;color:#fff3c4}
.free{display:flex;align-items:center;justify-content:center;gap:6px;font-size:40px;font-weight:800}
.free input{width:170px;font-size:40px;font-weight:800;text-align:center;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.5);color:#fff;border-radius:14px;padding:4px}
.rate{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 16px;font-size:13px;color:var(--mut);margin-bottom:18px}
.rate b{color:var(--tx)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ac2);margin-right:6px;animation:p 1.6s infinite}
.dot.off{background:var(--gold);animation:none}
@keyframes p{50%{opacity:.3}}
.tabs{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto;padding-bottom:4px}
.tab{flex:1 0 92px;background:var(--card);border:1px solid var(--bd);color:var(--mut);padding:12px 4px;border-radius:14px;cursor:pointer;font-size:12.5px;font-weight:600;text-align:center}
.tab span{display:block;font-size:22px;margin-bottom:3px}
.tab.on{background:var(--card2);border-color:var(--ac);color:#fff;box-shadow:0 0 0 2px rgba(108,92,231,.35)}
.pn{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px}
.pn h2{font-size:17px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card2);border-radius:12px;padding:11px 14px;margin-bottom:8px}
.row .l{font-size:11.5px;color:var(--mut)}.row .v{font-size:14.5px;font-weight:600;word-break:break-all}
.cp{background:var(--ac);color:#fff;border:0;border-radius:9px;padding:7px 12px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
.cp.ok{background:var(--ac2)}
.amt{background:rgba(247,183,49,.12);border:1px dashed var(--gold);color:var(--gold);border-radius:12px;padding:12px;text-align:center;font-weight:700;margin:12px 0 8px}
.wa{display:block;text-align:center;margin-top:18px;background:#25d366;color:#04220f;font-weight:700;padding:14px;border-radius:14px;text-decoration:none}
.ft{text-align:center;color:var(--mut);font-size:11.5px;margin-top:16px}
.ft a{color:var(--mut);cursor:pointer;text-decoration:underline}
/* admin */
#adm{display:none;position:fixed;inset:0;background:rgba(5,8,20,.92);z-index:9;overflow:auto;padding:16px}
#adm.on{display:block}
.ap{max-width:620px;margin:auto;background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px}
.ap h3{margin:16px 0 8px;font-size:15px;color:var(--ac2)}
.ap label{display:block;font-size:12px;color:var(--mut);margin:8px 0 3px}
.ap input,.ap select{width:100%;background:var(--card2);border:1px solid var(--bd);color:var(--tx);border-radius:10px;padding:10px;font-size:14px}
.ap input[type=checkbox]{width:auto}
.m{background:var(--card2);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-top:10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fr{display:grid;grid-template-columns:1fr 1.4fr auto;gap:6px;margin-top:6px}
.bt{border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer;color:#fff;background:var(--ac)}
.bt.g{background:var(--ac2);color:#04220f}.bt.r{background:var(--red)}.bt.s{background:var(--bd)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.msg{font-size:12.5px;color:var(--gold);margin-top:8px}
</style>
</head>
<body>
<div class="w" id="app"></div>
<div id="adm"><div class="ap" id="ap"></div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ====== 1) PEGA AQUÍ LA CONFIG DE TU FIREBASE (déjalo vacío para modo prueba local) ====== */
const FIREBASE_CONFIG = {
  // apiKey:"", authDomain:"", projectId:"", appId:""
};
/* ========================================================================================= */

const DEF={
  titulo:"Catálogo Digital",sub:"Elige tu método de pago y envía el comprobante",
  modo:"fijo",precio:30,min:5,whatsapp:"584248503187",tasaAuto:true,tasaManual:0,
  metodos:[
    {nombre:"Pago Móvil",icono:"📱",activo:true,moneda:"Bs",campos:[["Banco","0105 · Mercantil"],["Teléfono","04248503187"],["Cédula","25567842"],["Titular","Ismael Guevara"]]},
    {nombre:"Transferencia",icono:"🏦",activo:true,moneda:"Bs",campos:[["Banco","Mercantil, C.A. Banco Universal"],["RIF del banco","J-00002961-0"],["Titular","Ismael Guevara"],["Tipo de cuenta","Cuenta Corriente"],["Nº de cuenta","01050681641681225220"],["Documento","V-25.567.842"]]},
    {nombre:"Binance",icono:"🪙",activo:true,moneda:"USDT",campos:[["Binance ID","38245857"]]},
    {nombre:"Zelle",icono:"💵",activo:true,moneda:"USD",campos:[["Correo Zelle","tu-correo@ejemplo.com"],["Titular","Ismael Guevara"]]},
    {nombre:"PayPal",icono:"🅿️",activo:true,moneda:"USD",campos:[["Correo / usuario PayPal","tu-correo@ejemplo.com"]]}
  ]
};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
const fmt=n=>n.toLocaleString('es-VE',{minimumFractionDigits:2,maximumFractionDigits:2});
const clone=o=>JSON.parse(JSON.stringify(o));
let cfg=clone(DEF),tasa=null,monto=null,sel=0,ed=null,tasaOk=false;
const useFB=!!FIREBASE_CONFIG.projectId;
let db,auth;
if(useFB){firebase.initializeApp(FIREBASE_CONFIG);db=firebase.firestore();auth=firebase.auth();}

/* ---------- Tasa BCV ---------- */
async function cargarTasa(){
  const f=[async()=>{const j=await (await fetch('https://ve.dolarapi.com/v1/dolares/oficial')).json();return j.promedio||j.venta},
           async()=>{const j=await (await fetch('https://pydolarve.org/api/v1/dollar?page=bcv&monitor=usd')).json();return j.price}];
  tasaOk=false;
  for(const g of f){try{const v=Number(await g());if(v>0){tasa=v;tasaOk=true;localStorage.setItem('tasaBCV',v);break}}catch(e){}}
  if(!tasa){const g=Number(localStorage.getItem('tasaBCV'));if(g>0)tasa=g}
  render();
}
const tasaEf=()=>cfg.tasaAuto?tasa:(Number(cfg.tasaManual)||tasa);
const getMonto=()=>cfg.modo==="fijo"?Number(cfg.precio):(Number(monto)||0);

/* ---------- Vista cliente ---------- */
function render(keepInput){
  if(sel>=cfg.metodos.filter(m=>m.activo).length)sel=0;
  const act=cfg.metodos.filter(m=>m.activo),m=act[sel],t=tasaEf(),usd=getMonto(),bs=t?usd*t:0;
  const upd=cfg.tasaAuto?(tasaOk?'Act. automática':(tasa?'Última guardada':'Sin conexión')):'Tasa fija (manual)';
  const precio=cfg.modo==="fijo"
    ?`<div class="usd">$${fmt(usd)}</div>`
    :`<div class="free">$<input id="mi" type="number" inputmode="decimal" min="${cfg.min}" step="0.01" placeholder="${cfg.min}" value="${monto??''}"></div><small>Monto mínimo: $${fmt(Number(cfg.min))}</small>`;
  let panel="";
  if(m){
    const montoTxt=m.moneda==="Bs"?(t?`Bs. ${fmt(bs)}`:"calculando…"):`${fmt(usd)} ${m.moneda}`;
    const raw=m.moneda==="Bs"?(bs?bs.toFixed(2):""):usd.toFixed(2);
    panel=`<div class="pn"><h2>${esc(m.nombre)}</h2>`+
      m.campos.map(c=>`<div class="row"><div><div class="l">${esc(c[0])}</div><div class="v">${esc(c[1])}</div></div><button class="cp" data-c="${esc(c[1])}">Copiar</button></div>`).join("")+
      `<div class="amt">Monto a pagar: ${montoTxt}</div><button class="cp" style="width:100%;padding:11px" data-c="${raw}">Copiar monto</button></div>`;
  }
  const msg=`Hola, realicé el pago (${m?m.nombre:''}) del ${cfg.titulo}. Monto: $${fmt(usd)}`+(t?` (Bs. ${fmt(bs)}, tasa BCV ${fmt(t)})`:"")+`. Adjunto comprobante.`;
  const val=document.activeElement&&document.activeElement.id==="mi";
  const pos=val?document.activeElement.selectionStart:0;
  $("#app").innerHTML=`<div class="hd"><div class="badge">🔒 Pago seguro</div><h1>${esc(cfg.titulo)}</h1><p class="sub">${esc(cfg.sub)}</p></div>
  <div class="price"><small>${cfg.modo==="fijo"?"Total a pagar":"Ingresa el monto a pagar (USD)"}</small>${precio}<div class="bs">${t&&usd?'≈ Bs. '+fmt(bs):'&nbsp;'}</div></div>
  <div class="rate"><div><span class="dot ${tasaOk||!cfg.tasaAuto?'':'off'}"></span>Tasa BCV: <b>${t?fmt(t):'--'}</b> Bs/USD</div><div>${upd}</div></div>
  <div class="tabs">${act.map((x,i)=>`<div class="tab ${i===sel?'on':''}" data-i="${i}"><span>${esc(x.icono)}</span>${esc(x.nombre)}</div>`).join("")}</div>
  ${panel}
  <a class="wa" target="_blank" rel="noopener" href="https://wa.me/${esc(cfg.whatsapp)}?text=${encodeURIComponent(msg)}">✅ Enviar comprobante por WhatsApp</a>
  <p class="ft">Tu acceso se activa al confirmar el pago.<br><a onclick="abrirAdmin()">Administrar</a></p>`;
  if(val){const i=$("#mi");i.focus();i.setSelectionRange(pos,pos)}
}
document.addEventListener('click',e=>{
  const t=e.target.closest('.tab');if(t){sel=+t.dataset.i;render();return}
  const b=e.target.closest('.cp');if(!b||b.dataset.c===undefined)return;
  navigator.clipboard.writeText(b.dataset.c).then(()=>{const o=b.textContent;b.textContent='¡Copiado!';b.classList.add('ok');setTimeout(()=>{b.textContent=o;b.classList.remove('ok')},1200)}).catch(()=>{});
});
document.addEventListener('input',e=>{if(e.target.id==="mi"){monto=e.target.value;render()}});

/* ---------- Config guardada ---------- */
function aplicar(d){cfg=Object.assign(clone(DEF),d||{});render()}
if(useFB){db.doc("pagos/config").onSnapshot(s=>aplicar(s.exists?s.data():null),()=>render());}
else{try{const l=localStorage.getItem('cfgPago');if(l)aplicar(JSON.parse(l))}catch(e){}}

/* ---------- Administración ---------- */
function abrirAdmin(){
  $("#adm").classList.add("on");
  if(useFB&&!auth.currentUser){
    $("#ap").innerHTML=`<h2>🔐 Administrador</h2><label>Correo</label><input id="le" type="email"><label>Contraseña</label><input id="lp" type="password">
    <div class="bar"><button class="bt g" onclick="login()">Entrar</button><button class="bt s" onclick="cerrar()">Cancelar</button></div><div class="msg" id="lm"></div>`;
  }else editor();
}
function login(){auth.signInWithEmailAndPassword($("#le").value,$("#lp").value).then(editor).catch(()=>$("#lm").textContent="Correo o contraseña incorrectos.")}
function cerrar(){$("#adm").classList.remove("on")}
function editor(){ed=clone(cfg);pintarAdmin()}
function pintarAdmin(){
  const o=ed;
  $("#ap").innerHTML=`<h2>⚙️ Administrar página de pago</h2>
  ${useFB?'':'<div class="msg">Modo prueba: los cambios se guardan solo en este navegador. Conecta Firebase para que los vean tus clientes.</div>'}
  <h3>General</h3>
  <label>Título</label><input value="${esc(o.titulo)}" oninput="ed.titulo=this.value">
  <label>Subtítulo</label><input value="${esc(o.sub)}" oninput="ed.sub=this.value">
  <label>WhatsApp para comprobantes (con código de país, sin +)</label><input value="${esc(o.whatsapp)}" oninput="ed.whatsapp=this.value">
  <h3>Precio</h3>
  <div class="g2"><div><label>Tipo de precio</label><select onchange="ed.modo=this.value;pintarAdmin()"><option value="fijo" ${o.modo==='fijo'?'selected':''}>Precio fijo</option><option value="libre" ${o.modo==='libre'?'selected':''}>El cliente pone el precio</option></select></div>
  <div>${o.modo==='fijo'?`<label>Precio (USD)</label><input type="number" step="0.01" value="${o.precio}" oninput="ed.precio=+this.value">`:`<label>Monto mínimo (USD)</label><input type="number" step="0.01" value="${o.min}" oninput="ed.min=+this.value">`}</div></div>
  <h3>Tasa BCV</h3>
  <div class="g2"><div><label>Modo</label><select onchange="ed.tasaAuto=this.value==='1';pintarAdmin()"><option value="1" ${o.tasaAuto?'selected':''}>Automática</option><option value="0" ${o.tasaAuto?'':'selected'}>Manual</option></select></div>
  <div>${o.tasaAuto?'':`<label>Tasa Bs/USD</label><input type="number" step="0.01" value="${o.tasaManual}" oninput="ed.tasaManual=+this.value">`}</div></div>
  <h3>Métodos de pago</h3>
  ${o.metodos.map((m,i)=>`<div class="m">
    <label style="display:flex;gap:8px;align-items:center;margin:0"><input type="checkbox" ${m.activo?'checked':''} onchange="ed.metodos[${i}].activo=this.checked"> Visible para clientes</label>
    <div class="g2"><div><label>Nombre</label><input value="${esc(m.nombre)}" oninput="ed.metodos[${i}].nombre=this.value"></div>
    <div><label>Ícono (emoji)</label><input value="${esc(m.icono)}" oninput="ed.metodos[${i}].icono=this.value"></div></div>
    <label>Moneda en que se cobra</label><select onchange="ed.metodos[${i}].moneda=this.value"><option ${m.moneda==='Bs'?'selected':''}>Bs</option><option ${m.moneda==='USD'?'selected':''}>USD</option><option ${m.moneda==='USDT'?'selected':''}>USDT</option></select>
    <label>Datos de pago</label>
    ${m.campos.map((c,j)=>`<div class="fr"><input value="${esc(c[0])}" placeholder="Etiqueta" oninput="ed.metodos[${i}].campos[${j}][0]=this.value"><input value="${esc(c[1])}" placeholder="Valor" oninput="ed.metodos[${i}].campos[${j}][1]=this.value"><button class="bt r" onclick="ed.metodos[${i}].campos.splice(${j},1);pintarAdmin()">✕</button></div>`).join("")}
    <div class="bar"><button class="bt s" onclick="ed.metodos[${i}].campos.push(['',''] );pintarAdmin()">+ Dato</button>
    <button class="bt s" onclick="mover(${i},-1)">↑</button><button class="bt s" onclick="mover(${i},1)">↓</button>
    <button class="bt r" onclick="if(confirm('¿Eliminar método?')){ed.metodos.splice(${i},1);pintarAdmin()}">Eliminar</button></div></div>`).join("")}
  <div class="bar"><button class="bt s" onclick="ed.metodos.push({nombre:'Nuevo método',icono:'💳',activo:true,moneda:'USD',campos:[['','']]});pintarAdmin()">+ Agregar método</button></div>
  <div class="bar"><button class="bt g" onclick="guardar()">💾 Guardar cambios</button><button class="bt s" onclick="cerrar()">Cerrar</button>${useFB?'<button class="bt s" onclick="auth.signOut();cerrar()">Salir</button>':''}</div><div class="msg" id="gm"></div>`;
}
function mover(i,d){const j=i+d;if(j<0||j>=ed.metodos.length)return;[ed.metodos[i],ed.metodos[j]]=[ed.metodos[j],ed.metodos[i]];pintarAdmin()}
function guardar(){
  const ok=()=>{aplicar(ed);$("#gm").textContent="✅ Guardado";};
  if(useFB)db.doc("pagos/config").set(ed).then(ok).catch(()=>$("#gm").textContent="❌ No se pudo guardar (revisa las reglas de Firestore y tu sesión).");
  else{localStorage.setItem('cfgPago',JSON.stringify(ed));ok()}
}
if(location.hash==="#admin")abrirAdmin();
render();cargarTasa();setInterval(cargarTasa,600000);
</script>
</body>
</html>
